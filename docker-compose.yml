version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dreamguide
      POSTGRES_USER: dreamguide
      POSTGRES_PASSWORD: dreamguide_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - DATABASE_URL=postgresql+asyncpg://dreamguide:dreamguide_pass@postgres:5432/dreamguide
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    environment:
      - DATABASE_URL=postgresql+asyncpg://dreamguide:dreamguide_pass@postgres:5432/dreamguide
    depends_on:
      - postgres
      - api

volumes:
  pgdata:
